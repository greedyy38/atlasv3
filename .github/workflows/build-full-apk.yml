name: Build ATLAS Full APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified ATLAS sources
        shell: bash
        run: |
          set -euo pipefail
          cat \
            fullsrc/part000.b64 \
            fullsrc/part001.b64 \
            fullsrc/part002.b64 \
            fullsrc/part003.b64 \
            fullsrc/part004-005.b64 \
            fullsrc/part006-007.b64 \
            fullsrc/part008-009.b64 \
            fullsrc/part010-011.b64 \
            fullsrc/part012-013.b64 | tr -d '\r\n' > partial.b64
          base64 -d partial.b64 > partial.zip
          python3 - <<'PY'
          import os,struct,zlib
          data=open('partial.zip','rb').read(); pos=0; count=0
          sig=b'PK\x03\x04'
          while True:
              p=data.find(sig,pos)
              if p<0 or p+30>len(data): break
              vals=struct.unpack_from('<4s5H3I2H',data,p)
              _,ver,flag,method,mt,md,crc,csize,usize,nlen,xlen=vals
              ns=p+30; nameb=data[ns:ns+nlen]; ds=ns+nlen+xlen; de=ds+csize
              if de>len(data): break
              try: name=nameb.decode('utf-8')
              except: name=nameb.decode('cp437')
              if name.startswith('ATLAS-v0.23-FULL-ANDROID/'):
                  rel=name[len('ATLAS-v0.23-FULL-ANDROID/'):]
                  if rel and not rel.endswith('/'):
                      raw=data[ds:de]
                      if method==0: out=raw
                      elif method==8: out=zlib.decompress(raw,-15)
                      else: pos=de; continue
                      path=os.path.join('ATLAS-v0.23-FULL',rel)
                      os.makedirs(os.path.dirname(path),exist_ok=True)
                      open(path,'wb').write(out); count+=1
              pos=de
          print('Extracted complete entries:',count)
          PY
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/surface_worker.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/surface.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/app.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/worker_factory.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/survey_engine.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/js/v25_bridge.js
          test -f ATLAS-v0.23-FULL/app/src/main/assets/index.html

      - name: Complete Leaflet vendor files
        run: |
          set -e
          V=ATLAS-v0.23-FULL/app/src/main/assets/vendor
          mkdir -p "$V/images"
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o "$V/leaflet.js"
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o "$V/leaflet.css"
          for f in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do
            test -f "$V/images/$f" || curl -fsSL "https://unpkg.com/leaflet@1.9.4/dist/images/$f" -o "$V/images/$f"
          done
          test -s "$V/leaflet.draw.js"
          test -s "$V/leaflet.draw.css"

      - name: Create Android WebView host
        run: |
          set -e
          J=ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey
          mkdir -p "$J"
          cat > "$J/MainActivity.java" <<'JAVA'
          package com.atlas.survey;
          import android.app.Activity; import android.content.*; import android.net.Uri; import android.os.*; import android.provider.MediaStore; import android.webkit.*; import android.widget.Toast; import org.json.JSONObject; import java.io.*; import java.nio.charset.StandardCharsets;
          public class MainActivity extends Activity {
            static final int FILE_REQ=1001; WebView web; ValueCallback<Uri[]> cb;
            @Override public void onCreate(Bundle b){super.onCreate(b);web=new WebView(this);setContentView(web);WebSettings s=web.getSettings();s.setJavaScriptEnabled(true);s.setDomStorageEnabled(true);s.setAllowFileAccess(true);s.setAllowContentAccess(true);s.setDatabaseEnabled(true);web.addJavascriptInterface(new Bridge(),"Android");web.setWebViewClient(new WebViewClient());web.setWebChromeClient(new WebChromeClient(){@Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> c,FileChooserParams p){if(cb!=null)cb.onReceiveValue(null);cb=c;Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType("*/*");i.putExtra(Intent.EXTRA_MIME_TYPES,new String[]{"text/plain","text/csv","application/octet-stream","application/zip","image/tiff","image/geotiff"});startActivityForResult(i,FILE_REQ);return true;}});web.loadUrl("file:///android_asset/index.html");}
            @Override protected void onActivityResult(int r,int c,Intent d){super.onActivityResult(r,c,d);if(r==FILE_REQ&&cb!=null){Uri[] o=null;if(c==RESULT_OK&&d!=null&&d.getData()!=null)o=new Uri[]{d.getData()};cb.onReceiveValue(o);cb=null;}}
            void js(String x){runOnUiThread(()->web.evaluateJavascript(x,null));} String q(String x){return JSONObject.quote(x==null?"":x);}
            void save(String n,String m,byte[] d){try{ContentValues v=new ContentValues();v.put(MediaStore.Downloads.DISPLAY_NAME,n);v.put(MediaStore.Downloads.MIME_TYPE,m);if(Build.VERSION.SDK_INT>=29)v.put(MediaStore.Downloads.RELATIVE_PATH,"Download/ATLAS");Uri u=getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,v);try(OutputStream o=getContentResolver().openOutputStream(u)){o.write(d);}runOnUiThread(()->Toast.makeText(this,"Kaydedildi: "+n,Toast.LENGTH_SHORT).show());}catch(Exception e){}}
            public class Bridge {
              @JavascriptInterface public String getDeviceInfo(){try{JSONObject j=new JSONObject();j.put("model",Build.MODEL);j.put("manufacturer",Build.MANUFACTURER);j.put("sdk",Build.VERSION.SDK_INT);j.put("ram_mb",Runtime.getRuntime().maxMemory()/1048576);return j.toString();}catch(Exception e){return "{}";}}
              @JavascriptInterface public void saveText(String n,String m,String c){new Thread(()->save(n,m,c.getBytes(StandardCharsets.UTF_8))).start();}
              @JavascriptInterface public void saveBase64(String n,String m,String b){new Thread(()->save(n,m,android.util.Base64.decode(b,android.util.Base64.DEFAULT))).start();}
              @JavascriptInterface public void saveRecoveryState(String j){try(FileOutputStream f=openFileOutput("atlas_recovery.json",MODE_PRIVATE)){f.write(j.getBytes(StandardCharsets.UTF_8));}catch(Exception e){}}
              @JavascriptInterface public String loadRecoveryState(){try(FileInputStream f=openFileInput("atlas_recovery.json")){ByteArrayOutputStream b=new ByteArrayOutputStream();byte[] x=new byte[8192];int n;while((n=f.read(x))>0)b.write(x,0,n);return b.toString("UTF-8");}catch(Exception e){return "";}}
              @JavascriptInterface public void clearRecoveryState(){deleteFile("atlas_recovery.json");}
              @JavascriptInterface public void reportJsError(String m){android.util.Log.e("ATLAS-JS",m==null?"":m);}
              @JavascriptInterface public void vibrate(int ms){try{android.os.Vibrator v=(android.os.Vibrator)getSystemService(VIBRATOR_SERVICE);if(Build.VERSION.SDK_INT>=26)v.vibrate(android.os.VibrationEffect.createOneShot(Math.max(10,Math.min(1000,ms)),android.os.VibrationEffect.DEFAULT_AMPLITUDE));else v.vibrate(ms);}catch(Exception e){}}
              @JavascriptInterface public void requestLocation(){js("window.onNativeLocationError&&window.onNativeLocationError('Konum köprüsü bu buildde kapalı')");}
              @JavascriptInterface public boolean openAndroidSettings(String pin){try{startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS));return true;}catch(Exception e){return false;}}
              @JavascriptInterface public void pickDemFile(){js("window.onDemLoaded&&window.onDemLoaded(false,'','Yerel DEM köprüsü bu buildde kapalı')");}
              @JavascriptInterface public void prepareCopernicusDem(String p){js("window.onDemLoaded&&window.onDemLoaded(false,'','Copernicus DEM köprüsü bu buildde kapalı')");}
              @JavascriptInterface public boolean hasDem(){return false;} @JavascriptInterface public void sampleDemChunk(String id,int off,String c){js("window.onDemChunk&&window.onDemChunk("+q(id)+","+off+",'[]','DEM hazır değil')");}
              @JavascriptInterface public void testV25(String h,int p,String k){js("window.onV25Test&&window.onV25Test(false,'PC V25 köprüsü bağlı değil')");} @JavascriptInterface public void runV25(String h,int p,String k,String f,String c,String o){js("window.onV25Error&&window.onV25Error('PC V25 köprüsü bağlı değil')");} @JavascriptInterface public void saveLastV25Zip(){} @JavascriptInterface public void saveV25Image(String n){}
            }
            @Override public void onBackPressed(){if(web.canGoBack())web.goBack();else super.onBackPressed();}
          }
          JAVA
          cat > ATLAS-v0.23-FULL/app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/><application android:theme="@style/Theme.Atlas" android:label="ATLAS v0.23 FULL" android:usesCleartextTraffic="true" android:hardwareAccelerated="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          XML
          sed -i "s/namespace 'com.atlas.survey'/namespace 'com.atlas.survey'/" ATLAS-v0.23-FULL/app/build.gradle
          grep -q "applicationId 'com.greedyy38.atlasv3'" ATLAS-v0.23-FULL/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build full debug APK
        working-directory: ATLAS-v0.23-FULL
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify full engine assets
        run: |
          APK=ATLAS-v0.23-FULL/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" > apk-files.txt
          for f in assets/index.html assets/js/app.js assets/js/surface.js assets/js/surface_worker.js assets/js/worker_factory.js assets/js/survey_engine.js assets/js/v25_bridge.js assets/vendor/leaflet.js assets/vendor/leaflet.draw.js; do grep -q "$f" apk-files.txt || { echo "Missing $f"; exit 1; }; done
          cp "$APK" ATLAS-v0.23-FULL-Surfer-DefineRota.apk
          ls -lh ATLAS-v0.23-FULL-Surfer-DefineRota.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.23-FULL-Surfer-DefineRota
          path: ATLAS-v0.23-FULL-Surfer-DefineRota.apk
          if-no-files-found: error
