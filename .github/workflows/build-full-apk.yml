name: Build ATLAS Full APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover ATLAS web sources
        shell: bash
        run: |
          set -euo pipefail
          cat fullsrc/part000.b64 fullsrc/part001.b64 fullsrc/part002.b64 fullsrc/part003.b64 fullsrc/part004-005.b64 fullsrc/part006-007.b64 | tr -cd 'A-Za-z0-9+/=' > good80.b64
          tr -cd 'A-Za-z0-9+/=' < fullsrc/part008-009.b64 > bad20.b64
          python3 - <<'PY'
          import base64,hashlib,os,struct,zlib,binascii
          prefix=open('good80.b64').read(); bad=open('bad20.b64').read()
          assert len(prefix)==80000 and len(bad)==20001
          want={'app.js':'4cea10143179c73e0423c695e5aeda3b5cd922c83dc61c483e56ab8ec0b9513f','index.html':'57e30c13f2aa7cd94071521691c1b01a157ae18c10257f72c95fa168c359fd9c','app.css':'1eed6a08ff73a99182d8050ce12044e7413fefd98d97035ee09a05d1e16741aa'}
          def extract(data,write=False):
              pos=0; found={}; count=0
              while True:
                  p=data.find(b'PK\x03\x04',pos)
                  if p<0 or p+30>len(data): break
                  try: _,ver,flag,method,mt,md,crc,csize,usize,nlen,xlen=struct.unpack_from('<4s5H3I2H',data,p)
                  except: break
                  ns=p+30; ne=ns+nlen; ds=ne+xlen; de=ds+csize
                  if de>len(data) or nlen>1000 or xlen>10000: break
                  try: name=data[ns:ne].decode('utf-8')
                  except: break
                  raw=data[ds:de]
                  try: out=raw if method==0 else zlib.decompress(raw,-15) if method==8 else None
                  except: return None
                  if out is None or (binascii.crc32(out)&0xffffffff)!=crc: return None
                  base=name.rsplit('/',1)[-1]
                  if base in want: found[base]=hashlib.sha256(out).hexdigest()
                  if write and name.startswith('ATLAS-v0.23-FULL-ANDROID/'):
                      rel=name[len('ATLAS-v0.23-FULL-ANDROID/'):]
                      if rel and not rel.endswith('/'):
                          path=os.path.join('ATLAS-v0.23-FULL',rel); os.makedirs(os.path.dirname(path),exist_ok=True); open(path,'wb').write(out)
                  count+=1; pos=de
              return found,count
          repaired=None
          for i in range(len(bad)):
              s=prefix+bad[:i]+bad[i+1:]
              try: data=base64.b64decode(s,validate=True)
              except: continue
              r=extract(data)
              if r and all(r[0].get(k)==v for k,v in want.items()): repaired=data; break
          if repaired is None: raise SystemExit('Could not repair web source segment')
          found,count=extract(repaired,True); print('Recovered web entries:',count,found)
          PY
          for f in \
            app/src/main/assets/index.html \
            app/src/main/assets/js/app.js \
            app/src/main/assets/js/surface.js \
            app/src/main/assets/js/surface_worker.js \
            app/src/main/assets/js/worker_factory.js \
            app/src/main/assets/js/grid_worker.js \
            app/src/main/assets/js/exporters.js \
            app/src/main/assets/js/v25_bridge.js \
            app/src/main/assets/js/survey_engine.js \
            app/src/main/assets/css/app.css; do test -f "ATLAS-v0.23-FULL/$f"; done

      - name: Restore original full Android host
        shell: bash
        run: |
          set -euo pipefail
          cat fullhost/part0.b64 fullhost/part1.b64 fullhost/part2.b64 | tr -cd 'A-Za-z0-9+/=' | base64 -d > fullhost.zip
          echo '2a1d6054c8487112ee202081bb9b5c0940ac403297f2304f4a710bf4bce1701f  fullhost.zip' | sha256sum -c -
          unzip -qo fullhost.zip -d ATLAS-v0.23-FULL
          test -f ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/MainActivity.java
          test -f ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/V25BridgeClient.java
          test -f ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/DemSampler.java
          grep -q 'onShowFileChooser' ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/MainActivity.java
          grep -q 'requestLocationIfNeeded' ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/MainActivity.java
          grep -q 'new V25BridgeClient' ATLAS-v0.23-FULL/app/src/main/java/com/atlas/survey/MainActivity.java

      - name: Complete Gradle project and map vendor files
        shell: bash
        run: |
          set -euo pipefail
          cat > ATLAS-v0.23-FULL/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '9.4.0' apply false
          }
          EOF
          cat > ATLAS-v0.23-FULL/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AtlasMobile'
          include ':app'
          EOF
          cat > ATLAS-v0.23-FULL/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF
          grep -q "applicationId 'com.greedyy38.atlasv3'" ATLAS-v0.23-FULL/app/build.gradle
          V=ATLAS-v0.23-FULL/app/src/main/assets/vendor; mkdir -p "$V/images"
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o "$V/leaflet.js"
          curl -fsSL https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o "$V/leaflet.css"
          curl -fsSL https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js -o "$V/leaflet.draw.js"
          curl -fsSL https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css -o "$V/leaflet.draw.css"
          for f in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do curl -fsSL "https://unpkg.com/leaflet@1.9.4/dist/images/$f" -o "$V/images/$f"; done

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.6.0'}
      - name: Build full APK
        working-directory: ATLAS-v0.23-FULL
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify full APK
        run: |
          set -e
          A=ATLAS-v0.23-FULL/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$A" >/dev/null
          unzip -l "$A" > list.txt
          for f in assets/index.html assets/js/app.js assets/js/surface.js assets/js/surface_worker.js assets/js/worker_factory.js assets/js/survey_engine.js assets/js/v25_bridge.js assets/vendor/leaflet.js assets/vendor/leaflet.draw.js; do grep -q "$f" list.txt; done
          test $(stat -c%s "$A") -gt 500000
          cp "$A" ATLAS-v0.23-FULL-Surfer-DefineRota.apk
          sha256sum ATLAS-v0.23-FULL-Surfer-DefineRota.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.23-FULL-Surfer-DefineRota
          path: ATLAS-v0.23-FULL-Surfer-DefineRota.apk
          if-no-files-found: error
