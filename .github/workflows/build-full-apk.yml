name: Build ATLAS Full APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract full source
        run: |
          ls -l ATLAS-v0.23-FULL-COMPACT.zip
          sha256sum ATLAS-v0.23-FULL-COMPACT.zip
          set +e
          unzip -oq ATLAS-v0.23-FULL-COMPACT.zip
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          test -f ATLAS-v0.23-FULL/app/src/main/java/com/greedyy38/atlasv3/MainActivity.java
          test -f ATLAS-v0.23-FULL/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build full debug APK
        working-directory: ATLAS-v0.23-FULL
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp ATLAS-v0.23-FULL/app/build/outputs/apk/debug/app-debug.apk ATLAS-v0.23-FULL-Surfer-DefineRota.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.23-FULL-Surfer-DefineRota
          path: ATLAS-v0.23-FULL-Surfer-DefineRota.apk
          if-no-files-found: error
