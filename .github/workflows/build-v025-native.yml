name: Build ATLAS v0.25 Native

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-v025-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Android host
        shell: bash
        run: |
          set -euo pipefail
          cat fullhost/part0.b64 fullhost/part1.b64 fullhost/part2.b64 | tr -cd 'A-Za-z0-9+/=' > fullhost.bad.b64
          python3 - <<'PY'
          import base64,hashlib
          bad=open('fullhost.bad.b64').read().strip()
          target='2a1d6054c8487112ee202081bb9b5c0940ac403297f2304f4a710bf4bce1701f'
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          if len(bad)==28844:
              data=base64.b64decode(bad,validate=True)
              if hashlib.sha256(data).hexdigest()==target:
                  open('fullhost.zip','wb').write(data); raise SystemExit(0)
          if len(bad)!=28843: raise SystemExit('Unexpected fullhost base64 length')
          for i in range(10000):
              for ch in alphabet:
                  s=bad[:i]+ch+bad[i:]
                  try: data=base64.b64decode(s,validate=True)
                  except Exception: continue
                  if hashlib.sha256(data).hexdigest()==target:
                      open('fullhost.zip','wb').write(data); raise SystemExit(0)
          raise SystemExit('Could not repair fullhost base64')
          PY
          unzip -qo fullhost.zip -d ATLAS-v025
          test -f ATLAS-v025/app/src/main/java/com/atlas/survey/MainActivity.java

      - name: Apply Copernicus GLO-30 v0.25 patch
        run: |
          set -euo pipefail
          python3 tools/apply_v025_glo30.py
          grep -q 'isUsableCopernicusTile' ATLAS-v025/app/src/main/java/com/atlas/survey/MainActivity.java
          grep -q 'versionCode 25' ATLAS-v025/app/build.gradle

      - name: Complete Gradle project
        shell: bash
        run: |
          set -euo pipefail
          cat > ATLAS-v025/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '9.4.0' apply false }
          EOF
          cat > ATLAS-v025/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'AtlasMobile'
          include ':app'
          EOF
          cat > ATLAS-v025/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build native APK
        working-directory: ATLAS-v025
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native APK
        run: |
          set -euo pipefail
          A=ATLAS-v025/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$A" >/dev/null
          test $(stat -c%s "$A") -gt 10000
          cp "$A" ATLAS-v0.25-NATIVE-GLO30.apk
          sha256sum ATLAS-v0.25-NATIVE-GLO30.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.25-NATIVE-GLO30
          path: ATLAS-v0.25-NATIVE-GLO30.apk
          if-no-files-found: error
