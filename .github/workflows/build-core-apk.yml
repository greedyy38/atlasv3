name: Build ATLAS Core APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract core source
        run: |
          echo "740e3b0b022eb7293e2826170bc9c3e5c41c17e71b3df608a07fcb90fc358639  atlas_core_apk.zip" | sha256sum -c -
          unzip -q atlas_core_apk.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: atlas_core_apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp atlas_core_apk/app/build/outputs/apk/debug/app-debug.apk ATLAS-v0.22-Define-Rota-Core.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.22-Define-Rota-Core
          path: ATLAS-v0.22-Define-Rota-Core.apk
          if-no-files-found: error
