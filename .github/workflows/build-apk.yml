name: Build ATLAS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat source2/atlas_min.b64.part* > atlas_min.b64
          test "$(wc -c < atlas_min.b64)" -eq 235568
          base64 -d atlas_min.b64 > atlas_min.zip
          echo "5ccf73dd667cab03589589d3c99704f0d24b12775dc6692e65ea99cd244b1fa0  atlas_min.zip" | sha256sum -c -
          unzip -q atlas_min.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: atlas_min
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-v0.22-Define-Rota-Core-debug
          path: atlas_min/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
